# Introtekst

<i>Wat wil je een ander vertellen over je onderwerp ​

Hoe denk je dit te vertellen met eigen content? en met overige content zoals (links, afbeeldingen, tekst)

Schrijf een eerste stukje content als basis voor je garden (maximaal 180 tekens).</i>

Ik wil een gekke website maken maar als basis mijn grote hobby: gamen. Als ik kijk naar de voorbeelden is er een groot contrast tussen moderne "cleane" websites en websites die all over the place zijn. Ik wil het een soort combinatie maken. Ik wil op een of andere manier wel iets van een overzicht erin houden maar dat hoeft niet per se overal. Wel zou ik het chill vinden als er iets van een samenhorende stijl zou zijn, ookal past niet alles bij mekaar dat maakt het ook wel weer interressant om naar te kijken. Ik vond het altijd ook wel leuk om met mixed media te werken dus ik denk dat ik dat deze keer ga implementeren op mijn website ik weet nog niet hoe precies, maar het komt erin.
<br>
<br>
Ik kan dit doen door zelf dingen te maken, zowel digital als handmatig. Ik kan kijken naar hoe ze design toepassen in games, interfaces, menu's (gta5, telefoon in je zak als menu).
